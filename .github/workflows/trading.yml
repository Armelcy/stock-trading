name: Daily Screener

# Runs AFTER the close on completed daily bars. GitHub's scheduled runs land
# 1-9h late (Oct 2026: a 12:00 UTC cron fired 17:00-21:13 UTC), so the morning
# run handed the 9:45 ET executor stale or missing signals. Evening runs can be
# 9h late and still finish before the executor. Off-the-hour minutes avoid
# GitHub's top-of-hour queue. The second cron is a retry; re-runs are idempotent.
#   21:37 UTC = 5:37 PM EDT / 4:37 PM EST (both after the 4 PM close)
#   02:07 UTC = 10:07 PM EDT / 9:07 PM EST, previous ET day (Tue-Sat UTC)
on:
  schedule:
    - cron: '37 21 * * 1-5'
    - cron: '7 2 * * 2-6'
  workflow_dispatch:

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run screener
        run: python screener.py

      - name: Update dashboard (position marks)
        run: python update_dashboard.py

      - name: Sync picks to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_EZRA_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_EZRA_SERVICE_KEY }}
        run: python sync_supabase.py

      - name: Commit and push updated data.json
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet && exit 0
          git commit -m "screener $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "::error::push failed after 3 attempts (data.json conflict with executor?)"
          exit 1
