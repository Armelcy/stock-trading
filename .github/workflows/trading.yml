name: Daily Screener

on:
  schedule:
    # 8:00 AM ET = 12:00 UTC (summer/EDT). In winter (EST) this is 7:00 AM — still fine for pre-market.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # allow manual run from GitHub Actions UI

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push data.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run screener
        run: python screener.py

      - name: Update dashboard (P&L + oil refresh)
        run: python update_dashboard.py

      - name: Sync picks to Supabase
        continue-on-error: true  # non-fatal: stale key won't block screener output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_EZRA_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_EZRA_SERVICE_KEY }}
        run: python sync_supabase.py

      - name: Commit and push updated data.json
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet || git commit -m "screener $(date +'%Y-%m-%d %H:%M UTC')"
          git push
